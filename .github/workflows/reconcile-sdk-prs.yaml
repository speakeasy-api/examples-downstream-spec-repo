name: Reconcile SDK PRs

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
    types: [closed]

jobs:
  manage_sdk_prs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: typescript
            owner: speakeasy-api
            repo: examples-downstream-spec-sdk-typescript
          - language: python
            owner: speakeasy-api
            repo: examples-downstream-spec-sdk-python
    steps:
      - name: Manage ${{ matrix.language }} SDK PR
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_SDK_TOKEN }}
        run: |
          branch_name="${{ github.event.pull_request.head.ref }}"
          language="${{ matrix.language }}"
          owner="${{ matrix.owner }}"
          repo="${{ matrix.repo }}"
          was_merged="${{ github.event.pull_request.merged }}"

          echo "Reconciling PRs for $language..."
          echo "Target branch: $branch_name"
          echo "Action: $( [[ "$was_merged" == "true" ]] && echo "Merge" || echo "Close" )"

          # Find the PR in the downstream SDK repository with the matching branch name
          pr_data=$(gh pr list --repo "$owner/$repo" --head "$branch_name" --json number,title,url --jq '.[0]' 2>/dev/null || echo "null")

          if [[ "$pr_data" != "null" && -n "$pr_data" ]]; then
            pr_number=$(echo "$pr_data" | jq -r '.number')
            pr_title=$(echo "$pr_data" | jq -r '.title')
            pr_url=$(echo "$pr_data" | jq -r '.url')

            if [[ "$was_merged" == "true" ]]; then
              echo "Merging PR #$pr_number in $owner/$repo..."
              gh pr merge "$pr_number" --repo "$owner/$repo" --squash --delete-branch
              echo "✅ Successfully merged: $pr_title"
            else
              echo "Closing PR #$pr_number in $owner/$repo..."
              gh pr close "$pr_number" --repo "$owner/$repo" --comment "Closing this SDK PR because the source PR was closed without merging."
              echo "✅ Successfully closed: $pr_title"
            fi
            echo "URL: $pr_url"
          else
            echo "No matching PR found in $owner/$repo for branch '$branch_name'."
          fi
